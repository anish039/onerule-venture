<!DOCTYPE html>
<!-- OneRule Venture — auth/forgot-password.html -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – OneRule Venture</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
<button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
<div class="auth-card">
  <a href="../index.html" class="auth-brand">
    <div class="auth-logo-icon"><i class="fas fa-bolt"></i></div>
    <span class="auth-brand-name">OneRule Venture</span>
  </a>
  <h1 class="auth-title">Forgot your password?</h1>
  <p class="auth-sub">Enter your email and we'll send a reset link — expires in 15 minutes.</p>
  <div class="auth-alert" id="alert" role="alert"></div>
  <form id="forgot-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Email address</label>
      <input class="form-input" id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" />
      <div class="field-error" data-error="email"></div>
    </div>
    <button type="submit" class="btn-auth" id="submit-btn">
      <div class="spinner"></div>
      <span class="btn-label"><i class="fas fa-envelope"></i> Send Reset Link</span>
    </button>
  </form>
  <div class="auth-footer" style="margin-top:24px">
    <a href="login.html" class="auth-link" style="color:var(--muted);font-weight:500">
      <i class="fas fa-arrow-left" style="font-size:.8rem"></i> Back to login
    </a>
  </div>
</div>
<script src="auth-api.js"></script>
<script>
  initTheme();
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors();
    const email = document.getElementById('email').value.trim();
    const alert = document.getElementById('alert');
    const btn   = document.getElementById('submit-btn');
    if (!email || !email.includes('@')) { showFieldErrors({ email: 'Valid email required.' }); return; }
    btn.disabled = true; btn.classList.add('loading'); alert.className = 'auth-alert';
    const res = await AuthAPI.forgotPassword(email);
    btn.disabled = false; btn.classList.remove('loading');
    if (!res) return;
    // Always show generic success (to prevent email enumeration)
    alert.textContent = '✅ If that email is registered, a reset link has been sent. Check your inbox.';
    alert.className   = 'auth-alert success show';
    document.getElementById('forgot-form').reset();
  });
</script>
</body>
</html>
