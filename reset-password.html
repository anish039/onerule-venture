<!DOCTYPE html>
<!-- OneRule Venture — auth/reset-password.html -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – OneRule Venture</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
<button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
<div class="auth-card">
  <a href="../index.html" class="auth-brand">
    <div class="auth-logo-icon"><i class="fas fa-bolt"></i></div>
    <span class="auth-brand-name">OneRule Venture</span>
  </a>
  <h1 class="auth-title">Set a new password</h1>
  <p class="auth-sub">Choose a strong password you haven't used before.</p>
  <div class="auth-alert" id="alert" role="alert"></div>

  <!-- Invalid/missing token state -->
  <div id="invalid-token" style="display:none;text-align:center;padding:20px 0">
    <i class="fas fa-exclamation-circle" style="font-size:2.5rem;color:var(--danger);margin-bottom:16px;display:block"></i>
    <p style="color:var(--muted);margin-bottom:20px">This reset link is invalid or has expired.<br>Reset links are valid for 15 minutes only.</p>
    <a href="forgot-password.html" class="btn-auth" style="display:inline-flex;text-decoration:none;width:auto;padding:12px 24px">Request a new link</a>
  </div>

  <form id="reset-form" novalidate>
    <input type="hidden" id="reset-token" />
    <div class="form-group">
      <label class="form-label" for="password">New password</label>
      <div class="input-wrap">
        <input class="form-input" id="password" name="password" type="password" placeholder="Min. 8 characters" required autocomplete="new-password" />
        <button type="button" class="toggle-pw" onclick="togglePw('password', this)"><i class="fas fa-eye"></i></button>
      </div>
      <div class="pw-strength"><div class="pw-strength-fill" id="pw-fill"></div></div>
      <div class="pw-strength-text" id="pw-text"></div>
      <div class="field-error" data-error="password"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm new password</label>
      <div class="input-wrap">
        <input class="form-input" id="confirm_password" name="confirm_password" type="password" placeholder="Repeat password" required autocomplete="new-password" />
        <button type="button" class="toggle-pw" onclick="togglePw('confirm_password', this)"><i class="fas fa-eye"></i></button>
      </div>
      <div class="field-error" data-error="confirm_password"></div>
    </div>
    <button type="submit" class="btn-auth" id="submit-btn">
      <div class="spinner"></div>
      <span class="btn-label"><i class="fas fa-lock"></i> Set New Password</span>
    </button>
  </form>
</div>
<script src="auth-api.js"></script>
<script>
  initTheme();
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('invalid-token').style.display = 'block';
  } else {
    document.getElementById('reset-token').value = token;
  }

  document.getElementById('password').addEventListener('input', function() {
    const { score, label, color } = scorePassword(this.value);
    const fill = document.getElementById('pw-fill');
    const text = document.getElementById('pw-text');
    fill.style.width = `${(score / 5) * 100}%`;
    fill.style.background = color;
    text.textContent = label; text.style.color = color;
  });

  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const icon  = btn.querySelector('i');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearFieldErrors();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm_password').value;
    const token    = document.getElementById('reset-token').value;
    const alert    = document.getElementById('alert');
    const btn      = document.getElementById('submit-btn');
    const errors   = {};
    if (password.length < 8)    errors.password = 'Password must be at least 8 characters.';
    if (password !== confirm)   errors.confirm_password = 'Passwords do not match.';
    if (Object.keys(errors).length) { showFieldErrors(errors); return; }
    btn.disabled = true; btn.classList.add('loading'); alert.className = 'auth-alert';
    const res = await AuthAPI.resetPassword(token, password);
    btn.disabled = false; btn.classList.remove('loading');
    if (!res) return;
    if (res.success) {
      alert.textContent = '✅ Password reset! Redirecting to login…';
      alert.className   = 'auth-alert success show';
      document.getElementById('reset-form').style.display = 'none';
      setTimeout(() => { window.location.href = 'login.html?msg=Password+reset+successfully'; }, 2000);
    } else {
      if (res.errors) showFieldErrors(res.errors);
      else {
        alert.textContent = res.message || 'Reset failed. The link may have expired.';
        alert.className   = 'auth-alert error show';
        setTimeout(() => {
          document.getElementById('reset-form').style.display = 'none';
          document.getElementById('invalid-token').style.display = 'block';
        }, 2500);
      }
    }
  });
</script>
</body>
</html>
